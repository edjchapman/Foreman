name: dependency-review

# Gates the dependency *diff* of a PR — blocks newly-introduced vulnerable or
# license-incompatible packages before they land. Complements the scheduled,
# whole-tree pip-audit (audit.yml), which catches CVEs disclosed after merge.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
