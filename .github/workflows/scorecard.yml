name: scorecard

# OpenSSF Scorecard — scores the repo's supply-chain / security posture (branch
# protection, pinned actions, dependency-update tooling, code scanning, SAST, …),
# publishes the result (powers the README badge), and uploads findings to the
# Security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 9 * * 1" # weekly, Mondays 09:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # let an in-flight analysis finish; queued runs wait

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results via OIDC (powers the badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
